name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html core.js games1.js games2.js games3.js manifest.webmanifest sw.js icon-192.png icon-512.png www/
      - name: Install packages
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: AdMob app id (Google TEST id - replace with your real id before publishing)
        run: |
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>#' android/app/src/main/AndroidManifest.xml
      - name: App icon (optional, does not stop the build if it fails)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor "#0E2F2A"
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: injifataa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
